<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loong Blog</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <a href="/" class="site-title">Loong Blog</a>
      <nav class="site-nav">
        <a href="/" class="active">Home</a>
        <a href="/posts">Posts</a>
        <a href="/categories">Categories</a>
        <a href="/tags">Tags</a>
        <a href="/search">Search</a>
      </nav>
    </div>
  </header>

  <!-- Content Area -->
  <main id="app" class="container"></main>

  <!-- Footer -->
  <footer class="site-footer"><div class="container"><p>Powered by Loong Web Framework</p></div></footer>

  <script>
  // ===== Blog Frontend Router =====
  const API = '/api/blog';
  
  function e(tag, attrs = {}, ...children) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'className') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'href') { el.href = v; }
      else if (k === 'innerHTML') el.innerHTML = v;
      else el.setAttribute(k, v);
    }
    for (const c of children) {
      if (typeof c === 'string') el.appendChild(document.createTextNode(c));
      else if (c) el.appendChild(c);
    }
    return el;
  }

  async function api(path) {
    const res = await fetch(API + path);
    if (!res.ok) {
      let msg = `${res.status} ${res.statusText}`;
      try { const j = await res.json(); msg = j.message || j.error || msg; } catch(_) {}
      throw new Error(msg);
    }
    return res.json();
  }

  function formatDate(d) { return d ? new Date(d).toLocaleDateString('zh-CN', {year:'numeric',month:'long',day:'numeric'}) : ''; }
  function excerpt(body, max = 200) {
    const t = body.replace(/#{1,6}\s+/g, '').replace(/[*_~`]/g, '').replace(/\n{2,}/g, ' ').replace(/\n/g, ' ').trim();
    return t.length > max ? t.slice(0, max) + '...' : t;
  }
  function renderMarkdown(md) {
    if (!md) return '';
    let html = md
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/^### (.+)$/gm, '<h3>$1</h3>')
      .replace(/^## (.+)$/gm, '<h2>$1</h2>')
      .replace(/^# (.+)$/gm, '<h1>$1</h1>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/^---$/gm, '<hr>')
      .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
      .replace(/^- (.+)$/gm, '<li>$1</li>')
      .replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>')
      .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
      .replace(/\n{2,}/g, '</p><p>');
    html = '<p>' + html + '</p>';
    html = html.replace(/<p>\s*<\/p>/g, '');
    return html;
  }

  // ===== Views =====
  
  function HomeView() {
    const el = e('div', { className: 'hero' });
    const loading = e('div', { className: 'loading', innerHTML: 'Loading...' });
    el.appendChild(loading);
    
    Promise.all([
      api('/posts?status=all'),
      api('/categories'),
      api('/tags')
    ]).then(([postsData, catsData, tagsData]) => {
      const posts = postsData.posts || [];
      const cats = catsData.categories || [];
      const tags = tagsData.tags || [];
      
      const recent = posts.filter(p => p.status === 'published').slice(0, 5);
      
      el.innerHTML = '';
      el.appendChild(e('div', { className: 'hero' }, [
        e('p', { className: 'eyebrow' }, 'Loong Web Framework'),
        e('h1', {}, 'A blog built on Loong.'),
        e('p', {}, `Writing, sharing, and documenting — all powered by a Loong web server. ${posts.length} posts and counting.`)
      ]));
      
      if (recent.length > 0) {
        const list = e('div', { className: 'post-list container' });
        list.appendChild(e('h2', {}, 'Recent Posts'));
        recent.forEach(p => {
          list.appendChild(e('div', { className: 'post-card' }, [
            e('h3', {}, e('a', { href: `/post?slug=${encodeURIComponent(p.slug)}`, onClick: nav }, p.title)),
            e('div', { className: 'post-meta' }, [
              e('span', {}, formatDate(p.publishedAt)),
              e('span', {}, `${p.status}`)
            ]),
            e('div', { className: 'post-excerpt' }, excerpt(p.body)),
            e('div', { className: 'post-tags' },
              (p.tagIds || []).map(tid => tags.find(t => t.id === tid)).filter(Boolean).map(t => e('a', { className: 'tag', href: `/posts/by-tag?slug=${encodeURIComponent(t.slug)}`, onClick: nav }, t.name)))
          ]));
        });
        el.appendChild(list);
      }
    }).catch(err => {
      el.innerHTML = '';
      el.appendChild(e('div', { className: 'error-page' }, [e('h2', {}, 'Oops'), e('p', {}, err.message)]));
    });
    
    return el;
  }

  function PostListView() {
    const el = e('div', { className: 'post-list' });
    const loading = e('div', { className: 'loading', innerHTML: 'Loading...' });
    el.appendChild(loading);
    
    const q = new URLSearchParams(location.search);
    const status = q.get('status') || 'all';
    const categorySlug = q.get('category');
    const tagSlug = q.get('tag');
    
    let endpoint = '/posts?status=' + status;
    if (categorySlug) endpoint = '/posts/by-category?slug=' + encodeURIComponent(categorySlug);
    if (tagSlug) endpoint = '/posts/by-tag?slug=' + encodeURIComponent(tagSlug);
    
    api(endpoint).then(data => {
      const posts = data.posts || [];
      el.innerHTML = '';
      
      const title = categorySlug ? `Category: ${categorySlug}` : tagSlug ? `Tag: ${tagSlug}` : `All Posts (${posts.length})`;
      el.appendChild(e('h2', {}, title));
      
      if (posts.length === 0) {
        el.appendChild(e('p', {}, 'No posts found.'));
        return;
      }
      
      posts.forEach(p => {
        el.appendChild(e('div', { className: 'post-card' }, [
          e('h3', {}, e('a', { href: `/post?slug=${encodeURIComponent(p.slug)}`, onClick: nav }, p.title)),
          e('div', { className: 'post-meta' }, [e('span', {}, formatDate(p.publishedAt)), e('span', {}, p.status)]),
          e('div', { className: 'post-excerpt' }, excerpt(p.body)),
          e('div', { className: 'post-tags' },
            data.tags ? (p.tagIds || []).map(tid => data.tags.find(t => t.id === tid)).filter(Boolean).map(t => e('a', { className: 'tag', href: `/tag?slug=${encodeURIComponent(t.slug)}`, onClick: nav }, t.name))
            : []
          )
        ]));
      });
    }).catch(err => {
      el.innerHTML = '';
      el.appendChild(e('div', { className: 'error-page' }, [e('h2', {}, 'Oops'), e('p', {}, err.message)]));
    });
    
    return el;
  }

  function PostDetailView() {
    const el = e('div', { className: 'post-detail' });
    const loading = e('div', { className: 'loading', innerHTML: 'Loading...' });
    el.appendChild(loading);
    
    const q = new URLSearchParams(location.search);
    const slug = q.get('slug');
    if (!slug) {
      el.innerHTML = '';
      el.appendChild(e('div', { className: 'error-page' }, [e('h2', {}, 'Not Found'), e('p', {}, 'No slug specified'), e('a', { href: '/', onClick: nav }, '← Back to Home')]));
      return el;
    }
    
    api('/post?slug=' + encodeURIComponent(slug)).then(data => {
      const post = data.post || data;
      el.innerHTML = '';
      
      el.appendChild(e('a', { className: 'back-link', href: '/posts', onClick: nav }, '← All Posts'));
      el.appendChild(e('h1', {}, post.title));
      el.appendChild(e('div', { className: 'post-meta' }, [e('span', {}, formatDate(post.publishedAt)), e('span', {}, post.status)]));
      
      if (post.categoryId) {
        const catEl = e('div', { className: 'post-tags', style: 'margin-bottom:24px' });
        el.appendChild(catEl);
        api('/categories').then(d => {
          const cat = (d.categories || []).find(c => c.id === post.categoryId);
          if (cat) catEl.appendChild(e('a', { className: 'tag', href: `/posts?category=${encodeURIComponent(cat.slug)}`, onClick: nav }, cat.name));
        }).catch(() => {});
      }
      
      el.appendChild(e('div', { className: 'post-body', innerHTML: renderMarkdown(post.body) }));
      
      // Comments section
      const commentSection = e('div', { className: 'comment-section' });
      commentSection.innerHTML = '';
      el.appendChild(commentSection);
      
      api('/posts/comments?slug=' + encodeURIComponent(slug)).then(cd => {
        commentSection.appendChild(e('h3', {}, `Comments (${cd.count || 0})`));
        
        (cd.comments || []).forEach(c => {
          commentSection.appendChild(e('div', { className: 'comment-card' }, [
            e('div', { className: 'comment-author' }, c.authorName || 'Anonymous'),
            e('div', { className: 'comment-date' }, formatDate(c.createdAt)),
            e('div', { className: 'comment-body' }, c.body)
          ]));
        });
        
        const form = e('form', { className: 'comment-form', onSubmit: async (ev) => { ev.preventDefault(); const fd = new FormData(ev.target); try {
          await fetch(API + '/posts/comments?slug=' + encodeURIComponent(slug), { method: 'POST', body: new URLSearchParams({ authorName: fd.get('author') || 'Anonymous', body: fd.get('body') || '' }) });
          location.reload();
        } catch(err) { alert('Failed to post comment: ' + err.message); } } } }, [
          e('input', { name: 'author', placeholder: 'Your name (optional)', type: 'text' }),
          e('textarea', { name: 'body', placeholder: 'Write a comment...', required: 'required' }),
          e('button', { type: 'submit' }, 'Post Comment'),
          e('p', { className: 'note' }, 'Comments are anonymous. Be respectful.')
        ]);
        commentSection.appendChild(form);
      }).catch(() => {
        commentSection.appendChild(e('p', {}, 'Comments unavailable.'));
      });
    }).catch(err => {
      el.innerHTML = '';
      el.appendChild(e('div', { className: 'error-page' }, [
        e('h2', {}, 'Post Not Found'),
        e('p', {}, err.message),
        e('a', { href: '/posts', onClick: nav }, '← All Posts')
      ]));
    });
    
    return el;
  }

  function CategoriesView() {
    const el = e('div', { className: 'content-layout' });
    const main = e('div', { className: 'content-main post-list' });
    const sidebar = e('div', { className: 'content-sidebar' });
    el.appendChild(main);
    el.appendChild(sidebar);
    main.appendChild(e('div', { className: 'loading', innerHTML: 'Loading...' }));
    
    api('/categories').then(data => {
      main.innerHTML = '';
      main.appendChild(e('h2', {}, `Categories (${(data.categories || []).length})`));
      
      (data.categories || []).forEach(c => {
        main.appendChild(e('div', { className: 'post-card' }, [
          e('h3', {}, e('a', { href: `/posts?category=${encodeURIComponent(c.slug)}`, onClick: nav }, c.name)),
          e('div', { className: 'post-meta' }, [e('span', {}, c.desc || '')])
        ]));
      });
      
      // Tags sidebar
      sidebar.appendChild(e('div', { className: 'sidebar-section' },
        e('h4', {}, 'Tags')
      ));
      api('/tags').then(td => {
        const tagsEl = sidebar.querySelector('.sidebar-section');
        (td.tags || []).forEach(t => {
          tagsEl.appendChild(e('a', { href: `/posts?tag=${encodeURIComponent(t.slug)}`, onClick: nav }, `${t.name}`));
        });
      }).catch(() => {});
    }).catch(err => {
      main.innerHTML = '';
      main.appendChild(e('div', { className: 'error-page' }, [e('h2', {}, 'Oops'), e('p', {}, err.message)]));
    });
    
    return el;
  }

  function TagsView() {
    const el = e('div', { className: 'post-list' });
    el.appendChild(e('div', { className: 'loading', innerHTML: 'Loading...' }));
    
    api('/tags').then(data => {
      el.innerHTML = '';
      el.appendChild(e('h2', {}, `Tags (${(data.tags || []).length})`));
      
      const grid = e('div', { style: 'display:flex;flex-wrap:wrap;gap:12px' });
      (data.tags || []).forEach(t => {
        grid.appendChild(e('a', { className: 'tag', href: `/posts?tag=${encodeURIComponent(t.slug)}`, onClick: nav, style: 'font-size:15px;padding: 6px 14px' }, t.name));
      });
      el.appendChild(grid);
    }).catch(err => {
      el.innerHTML = '';
      el.appendChild(e('div', { className: 'error-page' }, [e('h2', {}, 'Oops'), e('p', {}, err.message)]));
    });
    
    return el;
  }

  function SearchView() {
    const q = new URLSearchParams(location.search).get('q') || '';
    const el = e('div', {});
    
    const hero = e('div', { className: 'hero' }, [
      e('h1', {}, 'Search'),
      e('form', { className: 'search-form', style: 'justify-content:center', onSubmit(ev) {
        ev.preventDefault(); const v = ev.target.querySelector('input').value.trim(); if (v) { history.pushState({}, '', '/search?q=' + encodeURIComponent(v)); route(); }
      } }, [
        e('input', { type: 'text', name: 'q', placeholder: 'Search posts...', value: q }),
        e('button', { type: 'submit' }, 'Search')
      ])
    ]);
    el.appendChild(hero);
    
    if (!q) return el;
    
    const results = e('div', { className: 'post-list container' });
    results.appendChild(e('div', { className: 'loading', innerHTML: 'Searching...' }));
    el.appendChild(results);
    
    api('/posts/search?q=' + encodeURIComponent(q)).then(data => {
      results.innerHTML = '';
      results.appendChild(e('h2', {}, `Results for "${q}" (${data.count || 0})`));
      
      if ((data.posts || []).length === 0) {
        results.appendChild(e('p', {}, 'No posts found. Try a different query.'));
        return;
      }
      
      (data.posts || []).forEach(p => {
        results.appendChild(e('div', { className: 'post-card' }, [
          e('h3', {}, e('a', { href: `/post?slug=${encodeURIComponent(p.slug)}`, onClick: nav }, p.title)),
          e('div', { className: 'post-meta' }, [e('span', {}, formatDate(p.publishedAt))]),
          e('div', { className: 'post-excerpt' }, excerpt(p.body, 300))
        ]));
      });
    }).catch(err => {
      results.innerHTML = '';
      results.appendChild(e('div', { className: 'error-page' }, [e('h2', {}, 'Search Error'), e('p', {}, err.message)]));
    });
    
    return el;
  }

  function NotFoundView() {
    return e('div', { className: 'error-page' }, [
      e('h2', {}, '404'),
      e('p', {}, 'Page not found.'),
      e('a', { href: '/', onClick: nav }, '← Back to Home')
    ]);
  }

  // ===== Router =====
  const routes = {
    '/': HomeView,
    '/posts': PostListView,
    '/post': PostDetailView,
    '/categories': CategoriesView,
    '/tags': TagsView,
    '/search': SearchView,
  };

  function nav(ev) {
    ev.preventDefault();
    const url = new URL(ev.target.href || ev.currentTarget.href);
    history.pushState({}, '', url.pathname + url.search);
    route();
  }

  function route() {
    let path = location.pathname;
    // match exact routes first, then check for query-based sub-routes
    if (path === '/posts/by-category') path = '/posts';
    if (path === '/posts/by-tag') path = '/posts';
    if (path === '/posts/comments') { location.replace('/'); return; }
    
    const viewFn = routes[path] || NotFoundView;
    const app = document.getElementById('app');
    app.innerHTML = '';
    app.appendChild(viewFn());
    
    // Update active nav
    document.querySelectorAll('.site-nav a').forEach(a => a.classList.remove('active'));
    const activeLink = document.querySelector(`.site-nav a[href="${path}"]`);
    if (activeLink) activeLink.classList.add('active');
  }

  // Intercept all clicks on internal links
  document.addEventListener('click', ev => {
    const link = ev.target.closest('a');
    if (!link || !link.href) return;
    const url = new URL(link.href);
    if (url.origin === location.origin && !link.hasAttribute('target')) {
      // check if it's a nav link that should be intercepted
      if (link.href.includes('/api/blog')) return; // let API links pass through
      ev.preventDefault();
      history.pushState({}, '', url.pathname + url.search);
      route();
    }
  });

  window.addEventListener('popstate', route);
  route();
  </script>
</body>
</html>
