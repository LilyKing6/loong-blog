services:
  blog-backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - LOONG_WEB_PORT=8080

  blog-frontend:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm start"
    environment:
      - BLOG_API_URL=http://blog-backend:8080/api/blog
      - DOCS_API_URL=http://blog-backend:8080/api/docs
      - PORT=3000
    depends_on:
      - blog-backend
